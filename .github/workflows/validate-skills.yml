name: Validate shared skills

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.x"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Test skill tooling
        run: python -m unittest discover -s tests -v

      - name: Check generated skill outputs
        run: python scripts/sync_skills.py --check
