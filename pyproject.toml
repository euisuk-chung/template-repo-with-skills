[project]
name = "project-template"
version = "0.1.0"
description = "Project description."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
  "pre-commit>=4.0",
  "pytest>=8.0",
  "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_template"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
# Shared skills are hashed into .agents/skills.lock and refreshed from the template,
# so they are not formatted or linted here. .claude/skills is generated output.
extend-exclude = [".agents", ".claude", "_notes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Scripts and tests import the sibling tooling after adjusting sys.path.
"scripts/*" = ["E402"]
"tests/*" = ["E402"]
