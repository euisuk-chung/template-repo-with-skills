# Install once with `uv run pre-commit install`; runs on every commit afterwards.
exclude: ^(\.agents/|\.claude/|_notes/|uv\.lock$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: sync-skills-check
        name: check generated skill outputs
        entry: python scripts/sync_skills.py --check
        language: system
        pass_filenames: false
        always_run: true
